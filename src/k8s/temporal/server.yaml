# Servidor de desarrollo de Temporal: frontend, history, matching, la UI web y un almacén SQLite,
# todo en un único proceso. Para aprender y para el clúster local; NO para producción (allí:
# Temporal Cloud o el chart de Helm oficial con PostgreSQL/Cassandra). Ver docs/operaciones/temporal.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: temporal
spec:
  replicas: 1
  # Recreate: dos servidores no pueden compartir el mismo fichero SQLite.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          image: temporalio/temporal:1.9.1
          args:
            - server
            - start-dev
            - --ip=0.0.0.0
            - --port=7233
            - --ui-port=8233
            - --metrics-port=9090
            # SQLite en un emptyDir: el historial sobrevive a reinicios del contenedor, pero se
            # pierde si se borra el pod. Suficiente para aprender.
            - --db-filename=/data/temporal.db
          ports:
            - name: grpc
              containerPort: 7233
            - name: ui
              containerPort: 8233
            - name: metrics
              containerPort: 9090
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal
spec:
  selector:
    app.kubernetes.io/name: temporal
  ports:
    - name: grpc
      port: 7233
      targetPort: grpc
    - name: ui
      port: 8233
      targetPort: ui
    - name: metrics
      port: 9090
      targetPort: metrics
