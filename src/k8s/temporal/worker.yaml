# Worker de Temporal (src/temporal): ejecuta el workflow PrescaleForEvent y sus activities. Es un
# Deployment e imagen aparte del servicio de contenido: nunca comparten proceso.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-worker
  namespace: temporal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-worker
    spec:
      serviceAccountName: temporal-worker
      # Sí necesita el token: las activities llaman a la API de Kubernetes con este ServiceAccount.
      automountServiceAccountToken: true
      # El SDK termina las activities en curso antes de salir.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: temporal-worker
          imagePullPolicy: IfNotPresent
          env:
            - name: TEMPORAL_ADDRESS
              value: temporal.temporal.svc.cluster.local:7233
            - name: TEMPORAL_NAMESPACE
              value: default
            - name: METRICS_ADDR
              value: ":9090"
          ports:
            - name: metrics
              containerPort: 9090
          # El servidor de métricas arranca con el worker; si el proceso se cuelga deja de responder.
          livenessProbe:
            tcpSocket:
              port: metrics
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-worker
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal-worker
spec:
  selector:
    app.kubernetes.io/name: temporal-worker
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
