# Temporal en el clúster local: servidor de desarrollo + worker del workflow PrescaleForEvent.
# Se despliega con `task temporal:deploy`. Decisiones y uso en docs/operaciones/temporal.md.
# Cada recurso declara su namespace: el RBAC vive en "cdn" (lo que el worker puede cambiar) y el
# resto en "temporal".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: content-delivery-platform
    includeSelectors: false

resources:
  - namespace.yaml
  - server.yaml
  - worker.yaml
  - rbac.yaml

images:
  - name: temporal-worker
    newName: temporal-worker
    newTag: local
