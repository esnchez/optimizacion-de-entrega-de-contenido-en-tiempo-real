# Métricas de Temporal: el servidor de desarrollo (server.yaml) y el worker (worker.yaml), en el
# namespace "temporal". El ServiceMonitor vive en "monitoring" para que `kubectl apply -k
# k8s/monitoring` funcione aunque Temporal aún no esté desplegado.
#
# Las métricas del worker llevan su propia etiqueta "namespace" (el namespace de Temporal,
# "default"); Prometheus la renombra a "exported_namespace" porque choca con la del pod.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: temporal
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [temporal]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [temporal, temporal-worker]
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
---
# Alertas del plano de control. Sin Alertmanager en local: se ven en Prometheus (/alerts) y Grafana.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: temporal
  namespace: monitoring
spec:
  groups:
    - name: temporal
      rules:
        - alert: TemporalWorkflowFailed
          expr: sum by (workflow_type) (increase(temporal_workflow_failed_total{job="temporal-worker"}[15m])) > 0
          labels: {severity: warning}
          annotations:
            summary: A {{ $labels.workflow_type }} run failed; its history in the Temporal UI shows which step and why
        - alert: TemporalWorkerDown
          expr: sum(up{job="temporal-worker"}) == 0 or absent(up{job="temporal-worker"})
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: No Temporal worker is running; started workflows wait in the queue
        - alert: TemporalActivityRetryingALot
          # WaitForReadyReplicas falla a propósito unas pocas veces mientras arrancan los pods.
          expr: sum by (activity_type) (increase(temporal_activity_execution_failed_total{job="temporal-worker"}[10m])) > 20
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.activity_type }} keeps failing and being retried (e.g. a 403 from a missing RBAC permission)"
        - alert: TemporalTaskBacklog
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(temporal_activity_schedule_to_start_latency_seconds_bucket{job="temporal-worker"}[5m]))) > 5
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Tasks wait more than 5 s in the queue before a worker picks them up
