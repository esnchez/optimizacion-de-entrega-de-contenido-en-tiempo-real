# Valores de kube-prometheus-stack (chart 92.10.1) para minikube. Decisiones en docs/operaciones/monitorizacion.md.
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --version 92.10.1 -n monitoring --create-namespace -f k8s/monitoring/kube-prometheus-stack-values.yaml

# Alertmanager no hace falta en local: las alertas se ven en Prometheus y Grafana.
alertmanager:
  enabled: false

# En minikube estos componentes del plano de control escuchan solo en localhost: Prometheus no
# puede scrapearlos y solo generarían alertas de "target down".
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Por defecto el operador solo recoge ServiceMonitors/reglas con la etiqueta del release.
    # Así recoge los nuestros (definidos fuera del chart) sin etiquetas especiales.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # k6 envía sus métricas (VUs, latencia vista por el cliente) por remote write: así la carga
    # y la reacción del sistema aparecen en la misma línea de tiempo.
    enableRemoteWriteReceiver: true
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1536Mi

grafana:
  # Solo para el clúster local. En un entorno compartido: Secret existente o SSO.
  adminPassword: admin
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  # Grafana 13 (almacenamiento unificado + índice de búsqueda) pasa de 370 MiB en reposo. Con el
  # límite anterior (512Mi) el recolector de Go entraba en bucle cerca del límite: 2,8 cores, peticiones
  # de 2 min y reinicios por la liveness probe. GOMEMLIMIT hace que el GC actúe antes del límite.
  env:
    GOMEMLIMIT: 900MiB
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

prometheus-node-exporter:
  # Con el driver docker de minikube, "/" no es un montaje compartido y node-exporter no arranca
  # si intenta montar el rootfs del host.
  hostRootFsMount:
    enabled: false
