# Overlay para minikube: S3 simulado con LocalStack dentro del clúster, menos réplicas.
#   task deploy:local   (o kubectl apply -k k8s/overlays/local, con la imagen content-delivery:local)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - localstack.yaml

configMapGenerator:
  - name: content-delivery-config
    namespace: cdn
    behavior: merge
    literals:
      - S3_ENDPOINT=http://localstack.localstack.svc.cluster.local:4566
      # 2 min: el reparto entre pods se ve dentro de los escalones de 3 min de las pruebas.
      - MAX_CONNECTION_AGE_SECS=120

# Credenciales ficticias que LocalStack acepta. En EKS no hay Secret: se usa IRSA.
secretGenerator:
  - name: content-delivery-aws
    namespace: cdn
    literals:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test

images:
  - name: content-delivery
    newTag: local

patches:
  - target:
      kind: Deployment
      name: content-delivery
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: content-delivery-aws
  - target:
      kind: HorizontalPodAutoscaler
      name: content-delivery
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 6
      # Escala local: k6 en minikube abre unos pocos miles de conexiones, así que el objetivo
      # por pod es bajo para que el escalado sea visible entre 2 y 6 réplicas.
      - op: replace
        path: /spec/metrics/0/pods/target/averageValue
        value: "500"
  # 6 réplicas con 1 core de request no caben en el nodo de minikube (4 cores reales) junto a k6 y
  # la monitorización. Con 500 conexiones por pod cada uno usa ~0.05 cores, así que 250m basta.
  - target:
      kind: Deployment
      name: content-delivery
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
  - target:
      kind: Ingress
      name: content-delivery
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: cdn.local
