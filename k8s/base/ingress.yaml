# Entrada HTTP pública. Anotaciones de ingress-nginx pensadas para servir contenido:
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: content-delivery
  annotations:
    # Sin buffering: nginx reenvía los bytes según llegan en lugar de volcar respuestas grandes
    # a disco. Mantiene la memoria acotada y respeta la contrapresión del cliente lento.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # Tiempo máximo entre dos lecturas del upstream (no del total de la descarga).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # Solo servimos contenido (GET/HEAD): no hace falta aceptar cuerpos grandes.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: cdn.example.com
      http:
        # Solo las rutas de contenido son públicas. /healthz, /readyz y /metrics quedan dentro del
        # clúster (kubelet y Prometheus llegan al pod directamente).
        paths:
          - path: /content
            pathType: Prefix
            backend:
              service:
                name: content-delivery
                port:
                  name: http
          - path: /url
            pathType: Prefix
            backend:
              service:
                name: content-delivery
                port:
                  name: http
