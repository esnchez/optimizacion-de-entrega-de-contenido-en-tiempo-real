# Identidad propia del servicio. En EKS el overlay le añade la anotación de IRSA para que el pod
# obtenga credenciales de AWS temporales sin claves estáticas.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: content-delivery
# El servicio no habla con la API de Kubernetes: no montamos su token.
automountServiceAccountToken: false
